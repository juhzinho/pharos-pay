<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pharos Pay</title>
  <meta name="description" content="Turn a sentence into an unsigned Pacific payment. Read-only." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,560&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
  </script>
  <style>
    :root { --ink: #f6efe2; --muted: #c3b39a; --gold: #e2b15a; --mint: #7ddec8; --coral: #ff6d7e; --line: rgba(255,255,255,.14); }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { color: var(--ink); background: #100c08; font: 16px/1.5 Outfit, system-ui, sans-serif; }
    #stage { position: fixed; inset: 0; z-index: 0; width: 100%; height: 100%; display: block; }
    header { position: fixed; z-index: 3; top: 0; left: 0; right: 0; display: flex; align-items: center; padding: 18px 28px; }
    .brand { color: inherit; text-decoration: none; letter-spacing: .16em; font-size: 13px; font-weight: 600; }
    .brand b { color: var(--gold); }
    .lang { margin-left: auto; display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
    .lang button { border: 0; background: transparent; color: var(--muted); padding: 7px 12px; cursor: pointer; font: 600 12px Outfit, sans-serif; }
    .lang button.on { background: #f4f0e6; color: #2a2116; }
    main { position: relative; z-index: 2; min-height: 100vh; display: grid; grid-template-columns: 1.05fr .95fr; gap: 28px; align-items: center; padding: 88px 32px 28px; }
    .hero { animation: rise .8s cubic-bezier(.16,.8,.2,1) both; max-width: 34rem; }
    .kicker { margin: 0 0 10px; letter-spacing: .18em; text-transform: uppercase; font-size: 12px; color: var(--gold); }
    h1 { margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 560; font-style: italic; font-size: clamp(52px, 7vw, 88px); line-height: .92; }
    .lead { color: var(--muted); max-width: 36ch; }
    .dock { background: rgba(16,12,8,.62); border: 1px solid var(--line); border-radius: 28px; padding: 16px; max-height: calc(100vh - 112px); display: flex; flex-direction: column; overflow: hidden; backdrop-filter: blur(18px); box-shadow: 0 24px 70px rgba(0,0,0,.35); animation: rise .9s .08s cubic-bezier(.16,.8,.2,1) both; }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; }
    .chips button, input, button { font: inherit; color: var(--ink); }
    .chips button { border: 1px solid var(--line); background: rgba(255,255,255,.04); color: var(--muted); border-radius: 999px; padding: 8px 12px; cursor: pointer; overflow-wrap: anywhere; text-align: left; }
    label { display: block; margin: 10px 0 4px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
    input { width: 100%; padding: 10px 12px; border-radius: 14px; border: 1px solid var(--line); background: rgba(8,6,4,.55); }
    .log { overflow: auto; display: flex; flex-direction: column; gap: 10px; margin: 12px 0; max-height: min(46vh, 520px); }
    .msg { animation: rise .45s cubic-bezier(.16,.8,.2,1) both; }
    .msg b { display: block; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); }
    .msg.you b { color: var(--mint); }
    .msg p { margin: 2px 0; }
    .detail { display: grid; gap: 6px; color: var(--muted); font-size: 14px; }
    .detail span, .detail code { overflow-wrap: anywhere; }
    .tag { letter-spacing: .12em; text-transform: uppercase; font-size: 11px; color: var(--gold); }
    code { font-family: ui-monospace, Consolas, monospace; font-size: 12px; word-break: break-all; white-space: pre-wrap; color: #f6efe2; }
    .row { display: flex; gap: 8px; }
    .row input { flex: 1; }
    .btn { border: 0; border-radius: 999px; padding: 12px 16px; background: var(--gold); color: #2a2116; font-weight: 600; cursor: pointer; }
    .btn:disabled { opacity: .55; }
    .status { min-height: 1.2em; color: var(--muted); font-size: 13px; }
    @keyframes rise { from { opacity: 0; translate: 0 14px; } to { opacity: 1; translate: 0 0; } }
    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; align-items: start; padding: 88px 16px 24px; }
      h1 { font-size: 52px; }
      #stage { opacity: .8; }
    }
    @media (prefers-reduced-motion: reduce) {
      .hero, .dock, .msg { animation: none; }
    }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>
  <header>
    <a class="brand" href="/"><b>PHAROS</b> PAY</a>
    <div class="lang"><button type="button" data-lang="en">EN</button><button type="button" data-lang="pt">PT</button></div>
  </header>
  <main>
    <section class="hero">
      <p class="kicker" id="kicker"></p>
      <h1 id="title"></h1>
      <p class="lead" id="lead"></p>
    </section>
    <section class="dock">
      <div class="chips" id="chips">
        <button type="button" data-ex="pay" id="pay"></button>
        <button type="button" data-ex="ask" id="ask"></button>
        <button type="button" data-ex="short" id="short"></button>
      </div>
      <label for="from" id="fromL"></label>
      <input class="mono" id="from" spellcheck="false" value="0x15dDce897D76ac39c188AdE4D353711A60395315" />
      <div class="log" id="log"></div>
      <form id="form">
        <div class="row">
          <input id="text" autocomplete="off" placeholder="send 1 USDC to 0x…" />
          <button class="btn" id="go" type="submit"></button>
        </div>
      </form>
      <p class="status" id="status"></p>
    </section>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
